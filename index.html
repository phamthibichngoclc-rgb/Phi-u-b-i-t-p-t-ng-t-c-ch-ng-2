gin-bottom:4px}.question{border-top:1px solid var(--line);padding:15px 0}.question:first-of-type{border-top:0}.qtitle{font-weight:750;margin-bottom:10px}.options{display:grid;gap:8px}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;transition:.15s}.opt:hover{border-color:var(--purple)}.opt input{accent-color:var(--purple);margin-top:5px}.opt.correct,.match-item.correct,.drop-slot.correct{background:var(--good);border-color:#34a978}.opt.wrong,.match-item.wrong{background:var(--bad);border-color:#df6969}.feedback{font-size:13px;font-weight:700;margin-top:7px;min-height:18px}.hint{color:var(--muted);font-size:13px}.tfrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.tfrow:last-child{border-bottom:0}.tfchoices{display:flex;gap:6px}.tfchoices label{border:1px solid var(--line);padding:6px 10px;border-radius:9px;cursor:pointer;font-size:13px}.tfchoices input{accent-color:var(--purple)}.fillinput{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 10px;border-radius:9px;width:min(100%,300px);font:inherit}.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.match-item{border:1px solid var(--line);border-radius:11px;padding:11px;font-size:14px}.match-item select{margin-top:7px;width:100%;padding:9px;border-radius:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}.drag-area{display:grid;grid-template-columns:1fr 1.15fr;gap:14px}.bank,.targets{border:1px solid var(--line);border-radius:15px;padding:14px;background:var(--bg)}.bank h3,.targets h3{font-size:15px;margin:0 0 10px}.tile-list{display:grid;gap:8px}.tile{border:1px solid #b7b0ff;background:light-dark(#f0eeff,#292747);border-radius:11px;padding:10px;cursor:pointer;touch-action:manipulation;user-select:none;font-weight:650;font-size:14px}.tile.selected{outline:3px solid var(--purple);outline-offset:1px}.tile.locked{opacity:.55;cursor:default}.drop-slot{border:2px dashed var(--line);border-radius:12px;min-height:68px;padding:9px;margin-bottom:9px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:4px}.drop-slot:last-child{margin-bottom:0}.drop-slot .target-title{font-weight:800;font-size:13px}.drop-slot .placed{font-size:14px;color:var(--purple);font-weight:700}.drop-slot.correct{border-style:solid}.drop-slot .slotmsg{font-size:12px;font-weight:800}.celebrate{animation:pop .35s ease}@keyframes pop{50%{transform:scale(1.025)}}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.btn{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer}.primary{color:white;background:linear-gradient(120deg,#6655dc,#367fe2)}.secondary{color:var(--ink);background:var(--bg);border:1px solid var(--line)}.result{display:none;margin-top:18px;padding:20px;border-radius:16px;background:linear-gradient(120deg,#e9e7ff,#e2f3ff);color:#252653}.result.show{display:block}.score{font-size:32px;font-weight:900}.remember{background:linear-gradient(130deg,light-dark(#f1efff,#24213f),light-dark(#eaf5ff,#192e45));border:1px solid var(--line);padding:17px;border-radius:14px}.remember li{margin:7px 0}.tiny{font-size:12px;color:var(--muted);margin-top:15px}.formula{font-size:24px;font-weight:900;color:var(--purple)}

/* UI + BEHAVIOR LAYER — cố định, không phụ thuộc nội dung môn học */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const maxScore=10;let selected=null;
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function norm(s){return (s||"").toLocaleLowerCase("vi").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/\s+/g,"").replace(/[₆₁₀₅ₙ]/g,c=>({"₆":"6","₁":"1","₀":"0","₅":"5","ₙ":"n"}[c]||c)).replace(/[{}]/g,"")}
function render(){
  const d=LESSON_DATA;
  document.title=d.meta.title;
  $("#appRoot").innerHTML=`
  <header class="hero"><div class="eyebrow">${esc(d.meta.subject)} · PHIẾU HỌC TẬP TƯƠNG TÁC</div><h1>${esc(d.meta.title.replace(" ","<br> "))}</h1><p>${esc(d.meta.intro)}</p><div class="pills"><span class="pill">⏱ ${esc(d.meta.duration)}</span><span class="pill">🧪 Chủ đề: ${esc(d.meta.topic)}</span><span class="pill">🎯 Tự chấm điểm</span></div></header>
  <section class="card"><div class="section-head"><div class="num">01</div><div><h2>Thông tin học sinh</h2><p class="sub">Điền thông tin trước khi làm bài.</p></div></div><div class="fields"><div class="field"><label for="student">Họ và tên</label><input id="student" placeholder="Nhập họ tên"></div><div class="field"><label for="classroom">Lớp</label><input id="classroom" placeholder="Ví dụ: 12A1"></div></div></section>
  <section class="card"><div class="section-head"><div class="num">02</div><div><h2>Mục tiêu bài học</h2><p class="sub">Sau bài học, em có thể…</p></div></div><div class="goals">${d.goals.map((g,i)=>`<div class="goal"><b>${String(i+1).padStart(2,"0")} · ${esc(g.label)}</b>${esc(g.text)}</div>`).join("")}</div></section>
  <section class="card" id="mcq"><div class="section-head"><div class="num">03</div><div><h2>Trắc nghiệm nhiều lựa chọn</h2><p class="sub">Chọn một đáp án đúng cho mỗi câu. (${d.mcq.length} câu · 4 điểm)</p></div></div>${d.mcq.map((q,i)=>`<div class="question" data-q="${esc(q.id)}" data-type="radio" data-answer="${esc(q.answer)}"><div class="qtitle">Câu ${i+1}. ${esc(q.text)}</div><div class="options">${q.options.map(([v,t])=>`<label class="opt"><input type="radio" name="${esc(q.id)}" value="${esc(v)}"> ${esc(v)}. ${esc(t)}</label>`).join("")}<div class="feedback"></div></div></div>`).join("")}</section>
  <section class="card" id="tf"><div class="section-head"><div class="num">04</div><div><h2>Đúng hay sai?</h2><p class="sub">Chọn Đúng hoặc Sai. (${d.trueFalse.length} ý · 2 điểm)</p></div></div>${d.trueFalse.map((q,i)=>`<div class="tfrow" data-q="${esc(q.id)}" data-answer="${q.answer}"><div>${i+1}. ${esc(q.text)}</div><div class="tfchoices"><label><input type="radio" name="${esc(q.id)}" value="true"> Đúng</label><label><input type="radio" name="${esc(q.id)}" value="false"> Sai</label></div></div>`).join("")}<div id="tfFeedback" class="feedback"></div></section>
  <section class="card" id="fill"><div class="section-head"><div class="num">05</div><div><h2>Điền khuyết</h2><p class="sub">Điền từ hoặc công thức còn thiếu. (${d.fill.length} câu · 1,5 điểm)</p></div></div>${d.fill.map((q,i)=>`<div class="question"><div class="qtitle">${i+1}. ${esc(q.text)}</div><input class="fillinput" data-q="${esc(q.id)}" data-answer="${esc(q.answers.join("|"))}" placeholder="${esc(q.placeholder||"")}"><div class="feedback"></div></div>`).join("")}</section>
  <section class="card" id="match"><div class="section-head"><div class="num">06</div><div><h2>Nối cột kiến thức</h2><p class="sub">Chọn nội dung phù hợp với từng mục ở cột A. (${d.matching.items.length} cặp · 2 điểm)</p></div></div><div class="matchgrid">${d.matching.items.map((q,i)=>`<div class="match-item" data-q="${esc(q.id)}" data-answer="${esc(q.answer)}">${String.fromCharCode(65+i)}. ${esc(q.label)}<select aria-label="Nối ${esc(q.label)}"><option value="">— Chọn cột B —</option>${d.matching.choices.map(([v,t])=>`<option value="${esc(v)}">${esc(v)}. ${esc(t)}</option>`).join("")}</select></div>`).join("")}</div></section>
  <section class="card" id="drag"><div class="section-head"><div class="num">07</div><div><h2>Thử thách kéo thả / chạm để ghép</h2><p class="sub">Chọn thẻ ở bên trái, sau đó chạm vào vị trí đích. Trên máy tính, em cũng có thể kéo thẻ vào ô. Đúng sẽ khóa đáp án; sai sẽ trả thẻ về kho.</p></div></div><div class="drag-area"><div class="bank"><h3>🧩 Kho thẻ kiến thức</h3><div class="tile-list" id="tileBank">${d.dragDrop.tiles.map(t=>`<div class="tile" tabindex="0" role="button" data-id="${esc(t.id)}" data-label="${esc(t.label)}">${esc(t.label)}</div>`).join("")}</div><div class="feedback" id="dragFeedback" aria-live="polite">Hãy chọn một thẻ để bắt đầu nhé!</div></div><div class="targets"><h3>🎯 Vị trí đích</h3>${d.dragDrop.targets.map(t=>`<div class="drop-slot" tabindex="0" role="button" data-target="${esc(t.id)}"><span class="target-title">${esc(t.label)}</span><span class="slot-content hint">Chạm vào đây để đặt thẻ</span></div>`).join("")}</div></div></section>
  <section class="card"><div class="section-head"><div class="num">08</div><div><h2>Ghi nhớ cuối bài</h2><p class="sub">Tóm tắt nhanh trước khi nộp bài.</p></div></div><div class="remember"><div class="formula">${esc(d.remember.formula)}</div><ul>${d.remember.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div><div class="tiny">Lưu ý: Phần kéo thả có tính tương tác riêng; điểm tổng kết tính từ các phần câu hỏi có đáp án chấm tự động.</div></section>

const scriptURL = 'https://script.google.com/macros/s/AKfycbxNLm6NfUP1OoFloZBhKfu8bjXFjjxJz9GkQDP2-SHiiontOb0-5ibwnnLfcEiEIpFp/exec';
function guiKetQuaVeSheet(hoTen,lop,diem,soCauDung,soCauSai,soCauChuaLam,tongSoCau){
  if(!scriptURL) return false;
  const data=new URLSearchParams({hoTen,lop,diem:String(diem),soCauDung:String(soCauDung),soCauSai:String(soCauSai),soCauChuaLam:String(soCauChuaLam),tongSoCau:String(tongSoCau)});
  try { return navigator.sendBeacon(scriptURL,data); }
  catch(e) { try { fetch(scriptURL,{method:'POST',mode:'no-cors',body:data,keepalive:true}); return true; } catch(_) { return false; } }
}
function grade(){
  let earned=0,answered=0,total=0;
  $$('.question[data-type="radio"]').forEach(q=>{total++;const chosen=$('input:checked',q),ok=!!chosen&&chosen.value===q.dataset.answer;if(chosen)answered++;if(ok)earned+=1;$$('.opt',q).forEach(o=>{o.classList.remove("correct","wrong");const i=$("input",o);if(i.value===q.dataset.answer)o.classList.add("correct");if(i.checked&&!ok)o.classList.add("wrong")});$('.feedback',q).textContent=ok?"Chính xác! 🎉":chosen?"Chưa đúng — xem đáp án được tô xanh.":"Chưa trả lời.";});
  let tfCorrect=0;$$('.tfrow').forEach(q=>{total++;const c=$('input:checked',q),ok=!!c&&c.value===q.dataset.answer;if(c)answered++;if(ok)tfCorrect++;q.style.background=c?(ok?"var(--good)":"var(--bad)"):"transparent";});earned+=tfCorrect*.5;$("#tfFeedback").textContent=`Đúng ${tfCorrect}/${LESSON_DATA.trueFalse.length} ý · ${(tfCorrect*.5).toFixed(1)}/2 điểm`;
  let fillCorrect=0;$$('.fillinput').forEach(i=>{total++;const aliases=i.dataset.answer.split("|").map(norm),ok=aliases.includes(norm(i.value));if(i.value.trim())answered++;if(ok)fillCorrect++;i.style.borderColor=ok?"#34a978":i.value.trim()?"#df6969":"var(--line)";i.parentElement.querySelector(".feedback").textContent=ok?"Chính xác! 🎉":i.value.trim()?"Chưa đúng. Đáp án: "+i.dataset.answer.split("|")[0]:"Chưa trả lời.";});earned+=fillCorrect*.5;
  let matchCorrect=0;$$('.match-item').forEach(q=>{total++;const sel=$("select",q),ok=sel.value===q.dataset.answer;if(sel.value)answered++;if(ok)matchCorrect++;q.classList.toggle("correct",ok);q.classList.toggle("wrong",!!sel.value&&!ok);});earned+=matchCorrect*.5;
  const score=Math.round(earned*100)/100;
  const tongSoCau=total;
  const soCauDung=$$('.question[data-type="radio"]').filter(q=>$('input:checked',q)?.value===q.dataset.answer).length+tfCorrect+fillCorrect+matchCorrect;
  const soCauChuaLam=total-answered;
  const soCauSai=total-soCauDung-soCauChuaLam;
  guiKetQuaVeSheet($('#student').value.trim(),$('#classroom').value.trim(),score,soCauDung,soCauSai,soCauChuaLam,tongSoCau);
$("#scoreText").textContent=`${score.toLocaleString("vi-VN")} / ${maxScore} điểm`;$("#detailText").textContent=`Trắc nghiệm: ${$$('.question[data-type="radio"]').filter(q=>$("input:checked",q)?.value===q.dataset.answer).length}/${LESSON_DATA.mcq.length} · Đúng/Sai: ${tfCorrect}/${LESSON_DATA.trueFalse.length} · Điền khuyết: ${fillCorrect}/${LESSON_DATA.fill.length} · Nối cột: ${matchCorrect}/${LESSON_DATA.matching.items.length}. Đã trả lời ${answered}/${total} mục chấm điểm.`;$("#encourage").textContent=score>=8?"Rất tốt! Em đã nắm khá vững kiến thức.":score>=5?"Khá ổn! Hãy xem lại các đáp án chưa đúng và phần ghi nhớ.":"Đừng nản nhé! Đọc phần ghi nhớ rồi thử làm lại để củng cố kiến thức.";$("#result").classList.add("show");$("#result").scrollIntoView({behavior:"smooth",block:"center"});
}
function selectTile(tile){if(tile.classList.contains("locked"))return;$$('.tile').forEach(t=>t.classList.remove("selected"));selected=tile;tile.classList.add("selected");$("#dragFeedback").textContent="Đã chọn: "+tile.dataset.label+" — hãy chạm vào vị trí đích."}
function place(tile,slot){if(!tile||!slot||tile.classList.contains("locked")||slot.classList.contains("correct"))return;const ok=tile.dataset.id===slot.dataset.target;if(ok){slot.classList.add("correct","celebrate");$(".slot-content",slot).className="slot-content placed";$(".slot-content",slot).textContent=tile.dataset.label;const msg=document.createElement("span");msg.className="slotmsg";msg.textContent="Chính xác! 🎉";slot.appendChild(msg);tile.classList.add("locked");tile.classList.remove("selected");tile.setAttribute("aria-disabled","true");$("#dragFeedback").textContent="Chính xác! 🎉 Thẻ đã được khóa tại vị trí đúng.";selected=null}else{$("#dragFeedback").textContent="Chưa đúng — thẻ đã trở về kho. Hãy thử lại nhé!";tile.classList.remove("selected");selected=null}}
function bindInteractions(){
  $("#submitBtn").addEventListener("click",grade);
  $$('.tile').forEach(tile=>{tile.addEventListener("click",()=>selectTile(tile));tile.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();selectTile(tile)}});tile.addEventListener("dragstart",e=>{if(tile.classList.contains("locked")){e.preventDefault();return}e.dataTransfer.setData("text/plain",tile.dataset.id);selected=tile});tile.draggable=true});
  $$('.drop-slot').forEach(slot=>{slot.addEventListener("click",()=>{if(selected)place(selected,slot);else $("#dragFeedback").textContent="Hãy chạm chọn một thẻ trong kho trước."});slot.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&selected){e.preventDefault();place(selected,slot)}});slot.addEventListener("dragover",e=>e.preventDefault());slot.addEventListener("drop",e=>{e.preventDefault();const id=e.dataTransfer.getData("text/plain"),tile=$(`.tile[data-id="${id}"]`);if(tile)place(tile,slot)})});
  $("#resetBtn").addEventListener("click",resetAll);
}
function resetAll(){
  document.querySelectorAll('input[type="radio"]').forEach(i=>i.checked=false);
  $$('input.fillinput').forEach(i=>{i.value="";i.style.borderColor="var(--line)";$(".feedback",i.parentElement).textContent=""});
  $$(".question .feedback").forEach(f=>f.textContent="");$$(".opt").forEach(o=>o.classList.remove("correct","wrong"));$$(".tfrow").forEach(q=>q.style.background="transparent");$("#tfFeedback").textContent="";
  $$(".match-item").forEach(q=>{q.classList.remove("correct","wrong");$("select",q).value=""});$$(".tile").forEach(t=>{t.classList.remove("locked","selected");t.removeAttribute("aria-disabled")});$$(".drop-slot").forEach(s=>{s.classList.remove("correct","celebrate");$(".slot-content",s).className="slot-content hint";$(".slot-content",s).textContent="Chạm vào đây để đặt thẻ";$(".slotmsg",s)?.remove()});
  selected=null;$("#dragFeedback").textContent="Hãy chọn một thẻ để bắt đầu nhé!";$("#result").classList.remove("show");$("#result").scrollIntoView({behavior:"smooth",block:"start"});
}
render();
</script></body></html>
